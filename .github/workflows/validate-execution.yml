name: Quarto Validate Fresh Execution

on:
  schedule:
    # Monthly at 06:00 UTC on the 15th.
    # Re-run notebooks against live external services without rebuilding envs.
    - cron: "0 6 15 * *"
  workflow_dispatch:

jobs:
  build:
    permissions:
      actions: write
      contents: write
    uses: ./.github/workflows/00-site-build.yml
    secrets: inherit
    with:
      refresh_environments: false
      clear_execution_cache: true
