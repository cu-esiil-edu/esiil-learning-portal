name: Quarto Warm Execution Cache

on:
  push:
    branches:
      - main
    paths:
      - "notebooks/**"
  workflow_dispatch:

jobs:
  build:
    permissions:
      actions: write
      contents: write
    uses: ./.github/workflows/00-site-build.yml
    secrets: inherit
    with:
      clear_environment_cache: false
      clear_execution_cache: false
      clear_lockfiles: false
      deploy: true
      cache_salt: stable
      refresh_execution: true
