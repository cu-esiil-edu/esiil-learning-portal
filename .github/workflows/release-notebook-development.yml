name: Development Notebook Build

on:
  push:
    branches:
      - main
    paths:
      - "notebooks/**"
  workflow_dispatch:

jobs:
  build:
    permissions:
      actions: write
      contents: write
    uses: ./.github/workflows/00-site-build.yml
    secrets: inherit
    with:
      refresh_environments: false
      clear_execution_cache: false
