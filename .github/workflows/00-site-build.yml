name: Quarto Build (Reusable)

on:
  workflow_call:
    inputs:
      refresh_environments:
        description: "Delete cached conda environments and generated lockfiles before build."
        required: false
        default: false
        type: boolean
      clear_execution_cache:
        description: "Delete cached Quarto freeze and Jupyter execution state before build."
        required: false
        default: false
        type: boolean

jobs:
  build-deploy:
    runs-on: ubuntu-latest
    defaults:
      run:
        shell: bash -el {0}
    permissions:
      contents: write
      actions: write
    env:
      QUARTO_CONDA_PREFIX: /usr/share/miniconda/envs/esiil-tools
      QUARTO_PYTHON: /usr/share/miniconda/envs/esiil-tools/bin/python
      QUARTO_SHARE_PATH: /usr/share/miniconda/envs/esiil-tools/share/quarto
      QUARTO_DENO: /usr/share/miniconda/envs/esiil-tools/bin/deno
      QUARTO_DENO_DOM: /usr/share/miniconda/envs/esiil-tools/lib/deno_dom.so
      QUARTO_DART_SASS: /usr/share/miniconda/envs/esiil-tools/bin/sass
      QUARTO_ESBUILD: /usr/share/miniconda/envs/esiil-tools/bin/esbuild
      QUARTO_PANDOC: /usr/share/miniconda/envs/esiil-tools/bin/pandoc
      QUARTO_TYPST: /usr/share/miniconda/envs/esiil-tools/bin/typst
      R_HOME: /usr/share/miniconda/envs/learning-portal/lib/R
      R_LIBS_USER: /usr/share/miniconda/envs/learning-portal/lib/R/library
      GITHUB_PAT: ${{ secrets.GITHUB_TOKEN }}
      EARTHDATA_USERNAME: ${{ secrets.EARTHDATA_USERNAME }}
      EARTHDATA_PASSWORD: ${{ secrets.EARTHDATA_PASSWORD }}
      GBIF_USER: ${{ secrets.GBIF_USER }}
      GBIF_PWD: ${{ secrets.GBIF_PWD }}
      GBIF_EMAIL: ${{ secrets.GBIF_EMAIL }}
      OLLAMA_AUTO_INSTALL: "1"
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Detect environment changes
        id: changed-files
        run: |
          environment_changed=false

          if [[ "$GITHUB_EVENT_NAME" == "push" ]]; then
            if jq -e '
              [.commits[]? | (.added + .modified + .removed)[]?]
              | any(startswith("environments/"))
            ' "$GITHUB_EVENT_PATH" >/dev/null; then
              environment_changed=true
            fi
          fi

          echo "environment_changed=${environment_changed}" >> "$GITHUB_OUTPUT"
          echo "Environment files changed: ${environment_changed}"

      - name: Set up Miniconda
        uses: conda-incubator/setup-miniconda@v3
        with:
          auto-activate-base: false
          activate-environment: esiil-tools

      - name: Clear selected build caches
        if: inputs.refresh_environments || inputs.clear_execution_cache || steps.changed-files.outputs.environment_changed == 'true'
        env:
          GH_TOKEN: ${{ github.token }}
          CLEAR_ENVIRONMENT: ${{ inputs.refresh_environments || steps.changed-files.outputs.environment_changed == 'true' }}
          CLEAR_EXECUTION: ${{ inputs.clear_execution_cache }}
        run: |
          cache_rows="$(
            gh cache list \
              --repo "$GITHUB_REPOSITORY" \
              --limit 100 \
              --json id,key \
              --jq '.[] | "\(.id)\t\(.key)"' \
              || true
          )"

          ids=""
          while IFS=$'\t' read -r id key; do
            [[ -z "$id" || -z "$key" ]] && continue

            if [[ "$key" == conda-* ]] && [[ "$CLEAR_ENVIRONMENT" == "true" ]]; then
              ids+="${id}"$'\n'
            fi

            if [[ "$key" == quarto-state-* ]] && [[ "$CLEAR_EXECUTION" == "true" ]]; then
              ids+="${id}"$'\n'
            fi
          done <<< "$cache_rows"

          if [[ -z "$ids" ]]; then
            echo "No selected build caches to clear."
            exit 0
          fi

          for id in $ids; do
            gh cache delete "$id" --repo "$GITHUB_REPOSITORY"
          done

      - name: Restore environment cache
        id: cache-conda
        uses: actions/cache/restore@v4
        with:
          path: |
            /usr/share/miniconda/envs
          key: conda-${{ runner.os }}-${{ hashFiles('environments/base/*.yml', 'environments/tools.yml') }}

      - name: Create or update conda environments
        if: steps.cache-conda.outputs.cache-hit != 'true'
        run: |
          conda env list | awk '{print $1}' | grep -qx esiil-tools \
            && conda env update -n esiil-tools -f environments/tools.yml \
            || conda env create -f environments/tools.yml
          conda env list | awk '{print $1}' | grep -qx learning-portal \
            && conda env update -n learning-portal -f environments/base/learning-portal.yml \
            || conda env create -f environments/base/learning-portal.yml
          conda run -n learning-portal pip install git+https://github.com/earthlab/earthpy@v0.10.1

      - name: Ensure tools environment exists
        run: |
          conda env list | awk '{print $1}' | grep -qx esiil-tools \
            || conda env create -f environments/tools.yml

      - name: Clear lockfiles
        if: inputs.refresh_environments || steps.changed-files.outputs.environment_changed == 'true'
        run: |
          find environments/locks -maxdepth 1 -type f -name '*.yml' -delete || true

      - name: Ensure cache directories exist
        run: |
          mkdir -p _freeze .jupyter_cache

      - name: Restore freeze and Jupyter cache
        id: cache-quarto-state
        uses: actions/cache/restore@v4
        with:
          path: |
            _freeze
            .jupyter_cache
          key: quarto-state-${{ runner.os }}-${{ hashFiles('_quarto.yml', '_quarto-portal.yml', '_quarto-release.yml', '_quarto-student.yml') }}-${{ github.run_id }}
          restore-keys: |
            quarto-state-${{ runner.os }}-${{ hashFiles('_quarto.yml', '_quarto-portal.yml', '_quarto-release.yml', '_quarto-student.yml') }}-
            quarto-state-${{ runner.os }}-

      - name: Debug conda and Quarto env
        run: |
          conda env list
          which conda
          /usr/share/miniconda/envs/esiil-tools/bin/quarto --version
          echo "QUARTO_CONDA_PREFIX=$QUARTO_CONDA_PREFIX"
          echo "QUARTO_PYTHON=$QUARTO_PYTHON"
          echo "QUARTO_SHARE_PATH=$QUARTO_SHARE_PATH"

      - name: Render
        run: /usr/share/miniconda/envs/esiil-tools/bin/quarto render

      - name: Save environment cache
        if: steps.cache-conda.outputs.cache-hit != 'true'
        uses: actions/cache/save@v4
        with:
          path: |
            /usr/share/miniconda/envs
          key: ${{ steps.cache-conda.outputs.cache-primary-key }}

      - name: Save freeze and Jupyter cache
        if: always()
        uses: actions/cache/save@v4
        with:
          path: |
            _freeze
            .jupyter_cache
          key: ${{ steps.cache-quarto-state.outputs.cache-primary-key }}

      - name: Deploy
        uses: peaceiris/actions-gh-pages@v4
        with:
          github_token: ${{ secrets.GITHUB_TOKEN }}
          publish_dir: _site
          keep_files: true
